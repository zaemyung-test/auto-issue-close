name: Auto Close Issues

on:
  issues:
    types: [labeled]

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close issue on specific labels
        uses: actions/github-script@v6
        with:
          script: |
            const label = context.payload.label && context.payload.label.name;
            if (!label) {
              console.log('No label found on payload; nothing to do.');
              return;
            }
            if (label === 'completed' || label === 'wontfix') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
              });
              console.log(`Closed issue #${context.issue.number} because label '${label}' was added`);
            } else {
              console.log(`Label '${label}' is not targeted for auto-closing; skipping.`);
            }
